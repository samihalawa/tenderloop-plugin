interface:
  display_name: "TenderLoop"
  short_description: "Review and track public tenders"
  default_prompt: "Show my upcoming TenderLoop deadlines and summarize my saved tender criteria."

dependencies:
  tools:
    - type: "mcp"
      value: "tenderloop"
      description: "Manage TenderLoop application records, deadlines, saved opportunities and portal recheck requests."
      transport: "streamable_http"
      url: "https://tenderloop.eu/mcp"

policy:
  allow_implicit_invocation: true
