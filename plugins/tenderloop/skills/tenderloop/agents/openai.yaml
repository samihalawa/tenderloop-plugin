interface:
  display_name: "TenderLoop"
  short_description: "Carry out your tender task with workspace context"
  default_prompt: "Use TenderLoop to complete my tender task."

dependencies:
  tools:
    - type: "mcp"
      value: "tenderloop"
      description: "Read the workspace playbook and manage its tender records, deadlines, saved opportunities and portal recheck requests. Other available execution tools perform the authorized portal or media work."
      transport: "streamable_http"
      url: "https://tenderloop.eu/mcp"

policy:
  allow_implicit_invocation: true
